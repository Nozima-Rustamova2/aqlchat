[project]
name = "aqlchat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.116.0",
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "google-genai>=2.11.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "uztransliterator>=0.0.36",
]

[dependency-groups]
dev = [
    "datasets>=5.0.0",
    "pillow>=12.3.0",
    "protobuf>=7.35.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
